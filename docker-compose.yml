services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bist-trend-forecaster
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped

